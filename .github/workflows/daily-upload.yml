name: Zifiri Saatler - Otomatik Video Uretimi

# Format: Zifiri Bekci anlatimli CIZGI FILM Short (cizgi-short motoru, MIT - Burak Ozer).
# Akis: senaryo + cekim plani (Gemini) -> seslendirme (ElevenLabs/Wiro, Callum) + whisper zamanlama
#       -> kareler 4 paralel isde render -> birlestir -> YouTube.
# Cekimlerin suresi SABIT DEGIL: her cekim seslendirmedeki cumlesi kadar surer.

on:
  # Zamanlama cron-job.org uzerinden disaridan tetikleniyor (workflow_dispatch).
  workflow_dispatch:
    inputs:
      upload:
        description: "YouTube'a yuklensin mi? (false = sadece video uret, Artifacts'tan indir)"
        required: false
        default: "true"
      deneme:
        description: "Kacinci deneme (hata olursa sistem kendini 3'e kadar yeniden baslatir)"
        required: false
        default: "1"

  # Test: 'cizgi-test' dalina push -> video uretilir, YAYINLANMAZ, sonuc dala test_cikti/ olarak yazilir
  push:
    branches: [cizgi-test]

permissions:
  contents: write

concurrency:
  group: zifiri-video
  cancel-in-progress: false

env:
  SHARDS: "4"
  # Yayin saatleri (Istanbul). cron-job.org run'i bundan 1-2 saat once baslatir; video hazir olunca bu saate planlanir.
  PUBLISH_SLOTS: "12:30,18:30"

jobs:
  hazirla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: FFmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: 1) Senaryo + cekim plani uret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/generate_story.py

      - name: 1b) Konuya ozel gorseller (gercek mekan arka plani + obje yakin plani)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/gen_backdrops.py

      - name: 2) Seslendirme (Wiro ElevenLabs v3 - Callum; yedek edge-tts)
        env:
          WIRO_API_KEY: ${{ secrets.WIRO_API_KEY }}
          WIRO_API_SECRET: ${{ secrets.WIRO_API_SECRET }}
        run: python scripts/generate_voice.py

      - name: 3) Cizgi projesini kur (whisper kelime zamani, plan, muzik + efekt)
        env:
          LANG_CODE: tr
          WHISPER_MODEL: small
        run: |
          pip install faster-whisper
          python scripts/cizgi_build.py

      - name: Projeyi sonraki islere aktar
        uses: actions/upload-artifact@v4
        with:
          name: proje-${{ github.run_number }}
          retention-days: 3
          path: |
            output/
            data/
            cizgi/work/
            cizgi/out/mix.wav
            cizgi/sound.json
            cizgi/script.txt

  render:
    needs: hazirla
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: proje-${{ github.run_number }}
      - name: Playwright + Chromium kur
        run: |
          pip install playwright numpy pillow
          python -m playwright install --with-deps chromium
      - name: Kareleri render et (parca ${{ matrix.shard }})
        run: |
          RANGE=$(python -c "import json;n=json.load(open('cizgi/work/plan.json'))['frames'];k=${{ matrix.shard }};s=int(n*k/${SHARDS});e=int(n*(k+1)/${SHARDS})-1;print(f'{s}-{e}')")
          echo "Kare araligi: $RANGE"
          python cizgi/tools/render.py cizgi frames "$RANGE" --cpu
          if [ "${{ matrix.shard }}" = "0" ]; then
            python cizgi/tools/render.py cizgi stills 40 --cpu --query nocap --out cizgi/frames/kapak
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kareler-${{ github.run_number }}-${{ matrix.shard }}
          retention-days: 1
          path: cizgi/frames/

  bitir:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      uploaded: ${{ steps.yt.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: FFmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Bagimliliklari kur
        run: pip install -r requirements.txt pillow
      - uses: actions/download-artifact@v4
        with:
          name: proje-${{ github.run_number }}
      - uses: actions/download-artifact@v4
        with:
          pattern: kareler-${{ github.run_number }}-*
          path: cizgi/frames
          merge-multiple: true

      - name: 4) Videoyu birlestir + kalite kontrol
        run: python scripts/cizgi_finish.py

      - name: 5) YouTube'a yukle
        id: yt
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload != 'false' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ secrets.YOUTUBE_PRIVACY }}
        run: python scripts/upload_youtube.py

      - name: 5b) TikTok'a da yukle (Upload-Post; anahtar yoksa atlar)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload != 'false' }}
        continue-on-error: true
        env:
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
        run: python scripts/upload_tiktok.py

      - name: 6) Hikaye gecmisini kaydet
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload != 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/music_history.json
          git diff --staged --quiet || git commit -m "Hikaye gecmisi guncellendi [otomatik]"
          git pull --rebase && git push

      - name: Test ciktisini dala yaz (sadece cizgi-test)
        if: ${{ github.event_name == 'push' }}
        run: |
          mkdir -p test_cikti && cp output/final.mp4 output/thumbnail.jpg output/story.json test_cikti/ && cp output/qa_sheet.jpg test_cikti/ || true
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f test_cikti && git commit -m "test ciktisi [skip ci]" && git push

      - name: Ciktilari sakla (hata ayiklama icin)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          retention-days: 3
          path: |
            output/final.mp4
            output/thumbnail.jpg
            output/qa_sheet.jpg
            output/story.json
            cizgi/work/plan.json

  # Ufak bir hata (ag, render, kalite kontrol) tum gunu bozmasin: video YUKLENMEDIYSE sistem
  # kendini bastan (yeni senaryoyla) yeniden baslatir; en fazla 3 deneme. Yuklendiyse asla tekrar etmez.
  tekrar_dene:
    needs: [hazirla, render, bitir]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.upload != 'false' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && needs.bitir.outputs.uploaded != 'true' && fromJSON(github.event.inputs.deneme || '1') < 3 }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Yeniden dene
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(( ${{ github.event.inputs.deneme || '1' }} + 1 ))
          echo "Deneme ${{ github.event.inputs.deneme || '1' }} basarisiz, deneme $N baslatiliyor"
          gh workflow run daily-upload.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}" -f upload=true -f deneme=$N
