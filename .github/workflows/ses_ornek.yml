name: Gecici ses ornegi (Wiro ElevenLabs)
on:
  push:
    branches: [cizgi-short]
    paths: [ses_ornek/make.py]
permissions:
  contents: write
jobs:
  ornek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - env:
          WIRO_API_KEY: ${{ secrets.WIRO_API_KEY }}
          WIRO_API_SECRET: ${{ secrets.WIRO_API_SECRET }}
        run: python ses_ornek/make.py
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ses_ornek/out || true; git commit -m "ses ornekleri [skip ci]" || true; git push
